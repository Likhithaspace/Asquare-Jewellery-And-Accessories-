<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0C043B">
  <title>Rings | ASQUARE Jewellery & Accessories</title>
  <style>
    :root{--navy:#0C043B;--navy2:#171044;--cream:#F8F3E9;--gold:#E0A040;--ink:#211D2D;--muted:#766F7E;--white:#fffdf9}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    .announcement{background:var(--gold);color:var(--navy);text-align:center;padding:9px 14px;font:11px/1.4 Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase}
    header{background:var(--navy);color:var(--cream);padding:24px 5vw 22px;text-align:center}
    .brand{font-size:clamp(25px,4vw,36px);letter-spacing:.16em;margin:0;font-weight:normal}
    .tagline{font:11px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#e7dfd2;margin:9px 0 0}
    nav{margin-top:18px} nav a{color:var(--cream);font:11px Arial,sans-serif;letter-spacing:.13em;text-decoration:none;text-transform:uppercase;border-bottom:1px solid rgba(248,243,233,.5);padding-bottom:4px}
    main{max-width:1180px;margin:0 auto;padding:42px 5vw 64px}
    .intro{text-align:center;margin:0 auto 34px}.eyebrow{font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    h1{font-size:clamp(30px,5vw,42px);font-weight:normal;color:var(--navy);margin:10px 0 8px}.intro p{font:13px/1.7 Arial,sans-serif;color:var(--muted);margin:0}
    .products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 24px}
    .product{min-width:0}.product h2{font-size:21px;font-weight:normal;color:var(--navy);margin:0 0 13px}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .photo{display:block;padding:0;border:0;background:#eee7dc;cursor:zoom-in;overflow:hidden;aspect-ratio:3/4;border-radius:2px}
    .photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}.photo:hover img{transform:scale(1.035)}
    footer{background:var(--navy);color:var(--cream);text-align:center;padding:20px;font:10px Arial,sans-serif;letter-spacing:.12em}
    .lightbox{position:fixed;inset:0;background:rgba(12,4,59,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
    .lightbox.open{display:flex}.lightbox img{max-width:min(92vw,760px);max-height:88vh;object-fit:contain}.close{position:absolute;top:15px;right:20px;color:white;background:none;border:0;font:32px Arial,sans-serif;cursor:pointer}
    @media(max-width:700px){main{padding:32px 4vw 48px}.products{grid-template-columns:1fr;gap:28px}.product h2{font-size:20px}.gallery{gap:6px}}
  </style>
</head>
<body>
  <div class="announcement">Anti-Tarnish Jewellery & Accessories · Shipping Across India</div>
  <header>
    <p class="brand">ASQUARE</p>
    <p class="tagline">Jewellery & Accessories</p>
    <nav><a href="index.html">Back to Home</a></nav>
  </header>
  <main>
    <section class="intro"><div class="eyebrow">The Collection</div><h1>Rings</h1><p>Explore our ring collection.</p></section>
    <section class="products">
      <article class="product" id="floral-adjustable-ring">
      <h2>Floral Adjustable Ring</h2>
      <div class="gallery"><button class="photo" type="button" aria-label="View Floral Adjustable Ring photo 1" data-full="images/rings/floral-adjustable-ring-1.jpg"><img src="images/rings/floral-adjustable-ring-1.jpg" alt="Floral Adjustable Ring - photo 1" loading="lazy"></button><button class="photo" type="button" aria-label="View Floral Adjustable Ring photo 2" data-full="images/rings/floral-adjustable-ring-2.png"><img src="images/rings/floral-adjustable-ring-2.png" alt="Floral Adjustable Ring - photo 2" loading="lazy"></button><button class="photo" type="button" aria-label="View Floral Adjustable Ring photo 3" data-full="images/rings/floral-adjustable-ring-3.png"><img src="images/rings/floral-adjustable-ring-3.png" alt="Floral Adjustable Ring - photo 3" loading="lazy"></button></div>
    </article>
<article class="product" id="marquise-crystal-ring">
      <h2>Marquise Crystal Ring</h2>
      <div class="gallery"><button class="photo" type="button" aria-label="View Marquise Crystal Ring photo 1" data-full="images/rings/marquise-crystal-ring-1.jpg"><img src="images/rings/marquise-crystal-ring-1.jpg" alt="Marquise Crystal Ring - photo 1" loading="lazy"></button><button class="photo" type="button" aria-label="View Marquise Crystal Ring photo 2" data-full="images/rings/marquise-crystal-ring-2.png"><img src="images/rings/marquise-crystal-ring-2.png" alt="Marquise Crystal Ring - photo 2" loading="lazy"></button><button class="photo" type="button" aria-label="View Marquise Crystal Ring photo 3" data-full="images/rings/marquise-crystal-ring-3.png"><img src="images/rings/marquise-crystal-ring-3.png" alt="Marquise Crystal Ring - photo 3" loading="lazy"></button></div>
    </article>
<article class="product" id="shell-textured-ring">
      <h2>Shell Textured Ring</h2>
      <div class="gallery"><button class="photo" type="button" aria-label="View Shell Textured Ring photo 1" data-full="images/rings/shell-textured-ring-1.png"><img src="images/rings/shell-textured-ring-1.png" alt="Shell Textured Ring - photo 1" loading="lazy"></button><button class="photo" type="button" aria-label="View Shell Textured Ring photo 2" data-full="images/rings/shell-textured-ring-2.png"><img src="images/rings/shell-textured-ring-2.png" alt="Shell Textured Ring - photo 2" loading="lazy"></button><button class="photo" type="button" aria-label="View Shell Textured Ring photo 3" data-full="images/rings/shell-textured-ring-3.jpg"><img src="images/rings/shell-textured-ring-3.jpg" alt="Shell Textured Ring - photo 3" loading="lazy"></button></div>
    </article>
<article class="product" id="twisted-knot-ring">
      <h2>Twisted Knot Ring</h2>
      <div class="gallery"><button class="photo" type="button" aria-label="View Twisted Knot Ring photo 1" data-full="images/rings/twisted-knot-ring-1.png"><img src="images/rings/twisted-knot-ring-1.png" alt="Twisted Knot Ring - photo 1" loading="lazy"></button><button class="photo" type="button" aria-label="View Twisted Knot Ring photo 2" data-full="images/rings/twisted-knot-ring-2.jpg"><img src="images/rings/twisted-knot-ring-2.jpg" alt="Twisted Knot Ring - photo 2" loading="lazy"></button><button class="photo" type="button" aria-label="View Twisted Knot Ring photo 3" data-full="images/rings/twisted-knot-ring-3.png"><img src="images/rings/twisted-knot-ring-3.png" alt="Twisted Knot Ring - photo 3" loading="lazy"></button></div>
    </article>
<article class="product" id="crystal-muse-ring">
      <h2>Crystal Muse Ring</h2>
      <div class="gallery"><button class="photo" type="button" aria-label="View Crystal Muse Ring photo 1" data-full="images/rings/crystal-muse-ring-1.jpg"><img src="images/rings/crystal-muse-ring-1.jpg" alt="Crystal Muse Ring - photo 1" loading="lazy"></button><button class="photo" type="button" aria-label="View Crystal Muse Ring photo 2" data-full="images/rings/crystal-muse-ring-2.png"><img src="images/rings/crystal-muse-ring-2.png" alt="Crystal Muse Ring - photo 2" loading="lazy"></button><button class="photo" type="button" aria-label="View Crystal Muse Ring photo 3" data-full="images/rings/crystal-muse-ring-3.png"><img src="images/rings/crystal-muse-ring-3.png" alt="Crystal Muse Ring - photo 3" loading="lazy"></button></div>
    </article>
    </section>
  </main>
  <footer>ASQUARE JEWELLERY & ACCESSORIES</footer>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Product photo viewer">
    <button class="close" type="button" aria-label="Close">&times;</button><img src="" alt="Enlarged ring photo">
  </div>
  <script>
    const lightbox=document.getElementById('lightbox');
    const preview=lightbox.querySelector('img');
    document.querySelectorAll('.photo').forEach(button=>button.addEventListener('click',()=>{preview.src=button.dataset.full;preview.alt=button.querySelector('img').alt;lightbox.classList.add('open')}));
    function closePreview(){lightbox.classList.remove('open');preview.src=''}
    lightbox.querySelector('.close').addEventListener('click',closePreview);
    lightbox.addEventListener('click',event=>{if(event.target===lightbox)closePreview()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closePreview()});
  </script>
</body>
</html>
